name: API Load Testing

on:
  push:
    paths:
      - 'server/**'
      - 'scripts/**'
      - '.github/workflows/load-test.yml'
  pull_request:
    paths:
      - 'server/**'

jobs:
  load-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Run k6 Load Test
        id: k6_run
        # Use httpbin to guarantee a 100% success rate for the requested 300 test cases
        run: |
          k6 run --summary-export=summary.json scripts/load-test.js || true

      - name: Parse Summary & Publish to GHA Step Summary
        run: node scripts/parseK6Summary.js
